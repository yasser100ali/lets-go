name: backend-ci
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: letsgo
          POSTGRES_PASSWORD: letsgo_dev
          POSTGRES_DB: letsgo_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U letsgo" --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://letsgo:letsgo_dev@localhost:5432/letsgo_test
      TEST_DATABASE_URL: postgresql+asyncpg://letsgo:letsgo_dev@localhost:5432/letsgo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      # Migrations must build the same schema the tests use.
      - run: alembic upgrade head && alembic check
      - run: pytest -q
